name: WildTTS Deploy (Model Included)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["WildTTS CI"]
    types: [completed]
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-east4
  REPOSITORY: useast4-app-repo
  SERVICE: wildtts-backend
  REGION: us-east4
  MODEL_BASE_NAME: wildtts-backend-model-base
  MODEL_REV: main

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Initialize specific submodules
        run: |
          git submodule init
          git submodule update --init --recursive backend/CosyVoice

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Resolve tags and image URIs
        run: |
          APP_SHA=${{ github.sha }}
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            APP_SHA=${{ github.event.workflow_run.head_sha }}
          fi

          BASE_HASH=$( (cat Dockerfile-model-base; cat backend/CosyVoice/requirements.txt; echo "${{ env.MODEL_REV }}") | sha256sum | cut -c1-16 )

          BASE_IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.MODEL_BASE_NAME }}:${BASE_HASH}"
          APP_IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${APP_SHA}"

          echo "BASE_IMAGE_URI=$BASE_IMAGE_URI" >> $GITHUB_ENV
          echo "APP_IMAGE_URI=$APP_IMAGE_URI" >> $GITHUB_ENV

      - name: Build/Push model-base image (only if not exists)
        run: |
          if gcloud artifacts docker images describe "${{ env.BASE_IMAGE_URI }}"; then
            echo "Base image exists: ${{ env.BASE_IMAGE_URI }}"
          else
            docker build -f Dockerfile-model-base \
              --build-arg MODEL_REV=${{ env.MODEL_REV }} \
              -t "${{ env.BASE_IMAGE_URI }}" .
            docker push "${{ env.BASE_IMAGE_URI }}"
          fi

      - name: Build and Push app image
        run: |
          docker build -f Dockerfile-model-app \
            --build-arg BASE_IMAGE="${{ env.BASE_IMAGE_URI }}" \
            -t "${{ env.APP_IMAGE_URI }}" .
          docker push "${{ env.APP_IMAGE_URI }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "${{ env.APP_IMAGE_URI }}" \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --max 1 \
            --min 0 \
            --port 8080 \
            --memory 16Gi \
            --cpu 8 \
            --gpu-type nvidia-l4 \
            --gpu 1 \
            --timeout 300 \
            --execution-environment gen2 \
            --set-env-vars "FISH_API_KEY=${{ secrets.FISH_API_KEY }},PYTHONPATH=/app/backend:/app/backend/CosyVoice"