name: backend CICD

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/wildtts-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/wildtts-ci.yml"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: northamerica-northeast2
  REPOSITORY: my-app-repo
  SERVICE: wildtts-backend
  REGION: northamerica-northeast2
  # 본인 버킷 이름으로 수정 필수!
  MODEL_BUCKET_NAME: " wildtts-models-1764630482"

jobs:
  test-wildtts:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup

      - name: Show disk usage
        run: |
          df -h
          du -sh /usr/local/lib/* || true

      - name: Checkout repository (without submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Set up Hugging Face CLI (login before pulling submodules)
        shell: bash -l {0}
        env:
          HF_TOKEN: ${{ secrets.TITW_Test_Token }}
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub
          # Provide git with credentials to access huggingface.co submodules
          printf "machine huggingface.co\nlogin hf\npassword %s\n" "$HF_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
          # Log in for huggingface CLI as well (optional)
          git config --global credential.helper store
          hf auth login --token "$HF_TOKEN" --add-to-git-credential

      - name: Initialize and update submodules (pull private HuggingFace submodule)
        run: |
          git submodule update --init --recursive

      - name: Set up Conda (wildtts env)
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: wildtts
          auto-activate-base: false
          python-version: "3.10"
          channels: conda-forge,defaults

      - name: Install ffmpeg for torchaudio
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge "ffmpeg<7"

      - name: Install CosyVoice dependencies
        shell: bash -l {0}
        working-directory: backend/CosyVoice
        run: |
          pip install -r requirements.txt

      - name: Download CosyVoice2-0.5B pretrained checkpoint
        shell: bash -l {0}
        working-directory: backend/CosyVoice
        run: |
          mkdir -p pretrained_models
          if [ ! -d pretrained_models/CosyVoice2-0.5B ]; then
            git clone https://www.modelscope.cn/iic/CosyVoice2-0.5B.git \
              pretrained_models/CosyVoice2-0.5B
          fi

      - name: Install WildTTS backend dependencies (fish-audio-sdk)
        shell: bash -l {0}
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Smoke test (run integration tests)
        shell: bash -l {0}
        working-directory: backend
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          python cosyvoice_test.py
          python fishaudio_test.py
          python test_interface.py

  deploy:

    needs: test-wildtts

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    runs-on: ubuntu-latest
    steps:

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.TITW_Test_Token }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev


      - name: Build and Push Container
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI


      - name: Deploy to Cloud Run
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          
          gcloud run deploy ${{ env.SERVICE }} \
            --image $IMAGE_URI \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 4Gi \
            --cpu 2 \
            --timeout 300 \
            --execution-environment gen2 \
            --add-volume name=model-volume,type=cloud-storage,bucket=${{ env.MODEL_BUCKET_NAME }} \
            --add-volume-mount volume=model-volume,mount-path=/app/backend/CosyVoice/pretrained_models
