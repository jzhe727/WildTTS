name: WildTTS / CosyVoice2 CI

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/wildtts-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/wildtts-ci.yml"

jobs:
  test-wildtts:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup

      - name: Show disk usage
        run: |
          df -h
          du -sh /usr/local/lib/* || true

      - name: Checkout repository (without submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Set up Hugging Face CLI (login before pulling submodules)
        shell: bash -l {0}
        env:
          HF_TOKEN: ${{ secrets.TITW_Test_Token }}
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub
          # Provide git with credentials to access huggingface.co submodules
          printf "machine huggingface.co\nlogin hf\npassword %s\n" "$HF_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
          # Log in for huggingface CLI as well (optional)
          git config --global credential.helper store
          hf auth login --token "$HF_TOKEN" --add-to-git-credential

      - name: Initialize and update submodules (pull private HuggingFace submodule)
        run: |
          git submodule update --init --recursive

      - name: Set up Conda (wildtts env)
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: wildtts
          auto-activate-base: false
          python-version: "3.10"
          channels: conda-forge,defaults

      - name: Install ffmpeg for torchaudio
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge "ffmpeg<7"

      - name: Install CosyVoice dependencies
        shell: bash -l {0}
        working-directory: backend/CosyVoice
        run: |
          pip install -r requirements.txt

      - name: Download CosyVoice2-0.5B pretrained checkpoint
        shell: bash -l {0}
        working-directory: backend/CosyVoice
        run: |
          mkdir -p pretrained_models
          if [ ! -d pretrained_models/CosyVoice2-0.5B ]; then
            git clone https://www.modelscope.cn/iic/CosyVoice2-0.5B.git \
              pretrained_models/CosyVoice2-0.5B
          fi

      - name: Smoke test (run template.py)
        shell: bash -l {0}
        working-directory: backend
        run: |
          python template.py
