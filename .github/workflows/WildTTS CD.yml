name: WildTTS Deploy

on:

  workflow_dispatch:

  workflow_run:
    workflows: ["WildTTS CI"]
    types:
      - completed
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: northamerica-northeast2
  REPOSITORY: my-app-repo
  SERVICE: wildtts-backend
  REGION: northamerica-northeast2
  # ▼▼▼ [필수 확인] 본인의 버킷 이름으로 수정되어 있는지 확인하세요! ▼▼▼
  MODEL_BUCKET_NAME: "wildtts-models-yyc-XXXXX" 

jobs:
  deploy:

    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false      
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Initialize specific submodules
        run: |
          git submodule init
          # backend/CosyVoice를 가져오면 내부의 Matcha-TTS까지(--recursive) 딸려옴
          git submodule update --init --recursive backend/CosyVoice

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |
          SHA=${{ github.sha }}
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            SHA=${{ github.event.workflow_run.head_sha }}
          fi
          
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${SHA}"
          
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE_URI }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 4Gi \
            --cpu 2 \
            --timeout 300 \
            --execution-environment gen2 \
            --add-volume name=model-volume,type=cloud-storage,bucket=${{ env.MODEL_BUCKET_NAME }} \
            --add-volume-mount volume=model-volume,mount-path=/app/backend/CosyVoice/pretrained_models
